version: 2
updates:
  # Actions, monthly and grouped into one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
  # npm is watched monthly, minor and patch only, in one grouped pull request.
  # Majors are ignored since Astro, TypeScript, and Vitest majors each need a
  # build row, and a red run inside a group is hard to attribute.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      bun:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: build(deps)
